# Production overlay, deployed on top of stack.yml:
#   cd docker && \
#     bash production/deploy-stack.sh   (wraps: docker stack deploy -c stack.yml -c this fiam)
#
# - Postgres is external (POSTGRES_HOST in .env), so the in-stack one is scaled
#   to 0 rather than started and left unused. Same for MinIO (documents are in
#   Hetzner Object Storage). Saves RAM on a small box.
# - The external Postgres' certificate (DB_SSL_CA_HOST on the host) is mounted
#   read-only into every service that connects to it, at /etc/fiam/db-ca.pem.
version: '3.8'

services:
  postgres:
    deploy:
      replicas: 0
  minio:
    deploy:
      replicas: 0
  auth:
    environment:
      # POSTGRES_PASSWORD_URL = the URL-encoded password, exported by
      # production/deploy-stack.sh (the raw password may contain @ $ : / etc.).
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URL}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/fiam_auth
    volumes:
      - ${DB_SSL_CA_HOST:?set DB_SSL_CA_HOST in docker/.env}:/etc/fiam/db-ca.pem:ro
  payment:
    environment:
      PAYMENT_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URL}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/fiam_payment
    volumes:
      - ${DB_SSL_CA_HOST}:/etc/fiam/db-ca.pem:ro
  admin:
    environment:
      # Production decision: the console uses the one external DB user directly
      # (no separate fiam_admin_app / fiam_readonly roles, so ADMIN_DB_PASSWORD
      # and READONLY_DB_PASSWORD in .env are unused). Its auth/payment
      # connections are still forced into read-only sessions by the app.
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URL}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/fiam_admin
      AUTH_READONLY_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URL}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/fiam_auth
      PAYMENT_READONLY_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URL}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/fiam_payment
    volumes:
      - ${DB_SSL_CA_HOST}:/etc/fiam/db-ca.pem:ro
