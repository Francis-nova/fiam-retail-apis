# One-time reverse proxy setup for the Hetzner box. Deployed once and left
# running; the app stack (stack.yml) is what gets redeployed on every
# release. Terminates TLS (Let's Encrypt via HTTP-01) and routes
# api.auth.staging.usefiam.com / api.payment.staging.usefiam.com to the
# matching service in the app stack over the shared `edge` overlay network.
#
# One-time setup, on the server:
#   docker swarm init                                   # if not already a swarm
#   docker network create --driver overlay --attachable edge
#   echo "ACME_EMAIL=you@usefiam.com" > docker/traefik.env
#   docker stack deploy -c docker/traefik-stack.yml --env-file docker/traefik.env traefik

version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - edge
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  edge:
    external: true

volumes:
  traefik-certs:
