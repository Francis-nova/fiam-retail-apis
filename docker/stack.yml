# The redeployable app stack: Postgres, Redis, RabbitMQ, MinIO, and the
# four Nest services (auth, payment, postoffice, admin), all sharing one built
# image (see ../Dockerfile) that's differentiated per service only by
# `command:`.
#
# Requires the `edge` overlay network from traefik-stack.yml to already
# exist (auth/payment join it so Traefik can route to them; postoffice has
# no public API — it's only reached over RabbitMQ — so it stays off `edge`;
# admin is the back-office API the staff console calls, so it joins `edge`).
#
# Deploy (from inside docker/ — `docker stack deploy` has no --env-file
# flag AND, unlike `docker compose`, does not auto-load a `.env` file
# either; confirmed on the server. ${VAR} substitution only sees real
# shell-exported env vars, so source the file first):
#   cd docker && set -a && . ./.env && set +a && docker stack deploy -c stack.yml fiam
#
# Redeploy after a new image is pushed to GHCR (re-running `docker stack
# deploy` with the same files also works — it diffs and only touches
# services whose config actually changed):
#   docker service update --image ghcr.io/francis-nova/fiam-retail-apis:staging fiam_auth
#   docker service update --image ghcr.io/francis-nova/fiam-retail-apis:staging fiam_payment
#   docker service update --image ghcr.io/francis-nova/fiam-retail-apis:staging fiam_postoffice
#   docker service update --image ghcr.io/francis-nova/fiam-retail-apis:staging fiam_admin

version: '3.8'

x-image: &image ${IMAGE:-ghcr.io/francis-nova/fiam-retail-apis:staging}

x-deploy-defaults: &deploy-defaults
  replicas: 1
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 5
  update_config:
    order: start-first
    failure_action: rollback

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - internal
    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    deploy:
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal
    deploy:
      restart_policy:
        condition: on-failure

  minio:
    # MinIO cut off anonymous image pulls entirely as of 2026-09-24 — gone
    # from Docker Hub, and quay.io/minio/minio now 401s even for `docker
    # pull` (not just Swarm's digest-resolution step). Chainguard's rebuild
    # is the same minio server binary/API, still pulls anonymously.
    # Worth a separate conversation about longer-term object storage now
    # that MinIO's own distribution is this unstable.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - internal
    deploy:
      restart_policy:
        condition: on-failure

  auth:
    image: *image
    command: ["node", "dist/apps/auth/apps/auth/src/main.js"]
    environment:
      NODE_ENV: production
      # Rate-limit counters (shared, survive restarts).
      REDIS_URL: redis://redis:6379
      AUTH_PORT: 7001
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/fiam_auth
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      KYC_PROVIDER: ${KYC_PROVIDER:-qoreid}
      QOREID_CLIENT_ID: ${QOREID_CLIENT_ID:-}
      QOREID_SECRET: ${QOREID_SECRET:-}
      QOREID_BASE_URL: ${QOREID_BASE_URL:-https://api.qoreid.com}
      QOREID_LIVENESS_CLIENT_ID: ${QOREID_LIVENESS_CLIENT_ID:-}
      QOREID_LIVENESS_SECRET: ${QOREID_LIVENESS_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-fiam-kyc-documents}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - edge
    deploy:
      <<: *deploy-defaults
      labels:
        - traefik.enable=true
        - traefik.http.routers.auth.rule=Host(`api.auth.staging.usefiam.com`) && !PathPrefix(`/internal`)
        - traefik.http.routers.auth.entrypoints=websecure
        - traefik.http.routers.auth.tls.certresolver=le
        - traefik.http.services.auth.loadbalancer.server.port=7001

  payment:
    image: *image
    command: ["node", "dist/apps/payment/apps/payment/src/main.js"]
    environment:
      NODE_ENV: production
      PAYMENT_PORT: 7003
      PAYMENT_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/fiam_payment
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PAYMENT_PROVIDER_NGN: vfd
      VFD_AUTH_BASE_URL: ${VFD_AUTH_BASE_URL:-https://api-devapps.vfdbank.systems/vfd-tech/baas-portal/v1.1/baasauth}
      VFD_WALLET_BASE_URL: ${VFD_WALLET_BASE_URL:-https://api-devapps.vfdbank.systems/vtech-wallet/api/v2/wallet2}
      VFD_CONSUMER_KEY: ${VFD_CONSUMER_KEY:-}
      VFD_CONSUMER_SECRET: ${VFD_CONSUMER_SECRET:-}
      VFD_WEBHOOK_AUTH_TOKEN: ${VFD_WEBHOOK_AUTH_TOKEN:-}
      VFD_BANK_CODE: ${VFD_BANK_CODE:-999999}
      VFD_WALLET_NAME: ${VFD_WALLET_NAME:-ADL}
      AUTH_INTERNAL_URL: http://auth:7001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - edge
    deploy:
      <<: *deploy-defaults
      labels:
        - traefik.enable=true
        - traefik.http.routers.payment.rule=Host(`api.payment.staging.usefiam.com`) && !PathPrefix(`/internal`)
        - traefik.http.routers.payment.entrypoints=websecure
        - traefik.http.routers.payment.tls.certresolver=le
        - traefik.http.services.payment.loadbalancer.server.port=7003

  postoffice:
    image: *image
    command: ["node", "dist/apps/postoffice/apps/postoffice/src/main.js"]
    environment:
      NODE_ENV: production
      POSTOFFICE_PORT: 7002
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMS_PROVIDER: termii
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-}
      TERMII_BASE_URL: ${TERMII_BASE_URL:-https://api.ng.termii.com}
      EMAIL_PROVIDER: zeptomail
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@usefiam.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Fiam}
      ZEPTOMAIL_TOKEN: ${ZEPTOMAIL_TOKEN:-}
      ZEPTOMAIL_BASE_URL: ${ZEPTOMAIL_BASE_URL:-api.zeptomail.com/}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
    deploy:
      <<: *deploy-defaults
    # No `edge` network / Traefik labels — postoffice has no REST API for
    # other services, it's only ever reached via the RabbitMQ queue.

  admin:
    image: *image
    command: ["node", "dist/apps/admin/apps/admin/src/main.js"]
    environment:
      NODE_ENV: production
      ADMIN_PORT: 7004
      # Blank = no IP restriction. Set to the office/VPN egress IPs or CIDRs.
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      # Encrypts staff TOTP secrets at rest (openssl rand -hex 32). Do not lose it.
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:?set ADMIN_TOTP_ENCRYPTION_KEY in docker/.env}
      # true = every staff member must enrol in 2FA before they can sign in.
      ADMIN_REQUIRE_2FA: ${ADMIN_REQUIRE_2FA:-false}
      ADMIN_TOTP_ISSUER: ${ADMIN_TOTP_ISSUER:-Fiam Console}
      # Staff alerts: emails super admins on sensitive actions via postoffice.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Rate-limit counters (shared, survive restarts).
      REDIS_URL: redis://redis:6379
      # Own database, owned by a dedicated role (not the Postgres superuser).
      ADMIN_DATABASE_URL: postgres://fiam_admin_app:${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in docker/.env}@postgres:5432/fiam_admin
      # Read-only, column-limited role into the other services' databases
      # (see postgres/admin-roles.sql) — never the superuser.
      AUTH_READONLY_DATABASE_URL: postgres://fiam_readonly:${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD in docker/.env}@postgres:5432/fiam_auth
      PAYMENT_READONLY_DATABASE_URL: postgres://fiam_readonly:${READONLY_DB_PASSWORD}@postgres:5432/fiam_payment
      # Called from a browser, so CORS stays on: must be the console's exact origin.
      CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:?set ADMIN_CORS_ORIGIN (the console's origin) in docker/.env}
      # Deliberately NOT JWT_ACCESS_SECRET: a staff token must never validate
      # against the customer APIs, nor a customer token against this one.
      ADMIN_JWT_ACCESS_SECRET: ${ADMIN_JWT_ACCESS_SECRET:?set ADMIN_JWT_ACCESS_SECRET in docker/.env}
      ADMIN_JWT_ACCESS_TTL: ${ADMIN_JWT_ACCESS_TTL:-15m}
      ADMIN_JWT_REFRESH_TTL_DAYS: ${ADMIN_JWT_REFRESH_TTL_DAYS:-7}
      # Writes go through these services' /internal APIs over the private
      # network; /internal is excluded from both public Traefik routers.
      AUTH_INTERNAL_URL: http://auth:7001
      PAYMENT_INTERNAL_URL: http://payment:7003
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in docker/.env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - edge
    deploy:
      <<: *deploy-defaults
      labels:
        - traefik.enable=true
        - traefik.http.routers.admin.rule=Host(`api.admin.staging.usefiam.com`)
        - traefik.http.routers.admin.entrypoints=websecure
        - traefik.http.routers.admin.tls.certresolver=le
        - traefik.http.services.admin.loadbalancer.server.port=7004

  # Staff console (static SPA). Built ON the server from the fiam-console repo
  # (no registry): see docker/README.md "Admin console API" step 7.
  console:
    image: fiam-console:staging
    environment:
      # The admin API origin the console's CSP allows it to call.
      API_ORIGIN: ${CONSOLE_API_ORIGIN:-https://api.admin.staging.usefiam.com}
    networks:
      - edge
    deploy:
      <<: *deploy-defaults
      labels:
        - traefik.enable=true
        - traefik.http.routers.console.rule=Host(`console.staging.usefiam.com`)
        - traefik.http.routers.console.entrypoints=websecure
        - traefik.http.routers.console.tls.certresolver=le
        - traefik.http.services.console.loadbalancer.server.port=80

networks:
  internal:
  edge:
    external: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
