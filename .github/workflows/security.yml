name: Security scan

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Re-scan weekly: new CVEs are published against code that hasn't changed.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # Dependencies (package-lock.json), committed secrets, Dockerfile/IaC misconfig.
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,dist
          exit-code: '1'

  # The shipped artifact: OS packages + everything in the runtime image.
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: fiam-retail-apis:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fiam-retail-apis:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
